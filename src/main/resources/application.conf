ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.nexus.ApplicationKt.module ]
    }
}

auth0 {
    domain = ${?AUTH0_DOMAIN}
    clientId = ${?AUTH0_CLIENT_ID}
    clientSecret = ${?AUTH0_CLIENT_SECRET}
    audience = ${?AUTH0_AUDIENCE}
}

jwt {
    domain = ${?AUTH0_DOMAIN}
    audience = ${?AUTH0_AUDIENCE}
}

storage {
    uri = ${?MONGO_URI}
}